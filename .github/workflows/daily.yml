name: Günlük ürün üretimi
on:
  # GitHub's own cron is unreliable (fired 9 hours late), so there is no schedule here:
  # the always-on Telegram listener (poll.yml) starts this every day at 09:20 Turkey time.
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç ürün üretilsin? (boş = ayarlardaki sayı)"
        required: false
        default: ""
concurrency:
  group: daily
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      panel: "true"
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ürünleri üret
        run: |
          if [ -n "${{ github.event.inputs.count }}" ]; then
            python -m bot generate --count "${{ github.event.inputs.count }}"
          else
            python -m bot generate
          fi
      - name: Onayları dinlemeye başla (~1 saat)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run poll.yml --repo "$GITHUB_REPOSITORY" -f chain=6
      - name: Paneli hazırla
        if: always()
        run: python -m bot panel --out _site
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
  deploy-panel:
    needs: run
    if: always() && needs.run.outputs.panel == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
