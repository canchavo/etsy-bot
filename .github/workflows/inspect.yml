name: Teslim dosyasını incele
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Ürün başlığında geçen kelimeler (ör. Italian Kitchen)"
        required: true
concurrency:
  group: inspect
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ABACUS_DATABASE_URL: ${{ secrets.ABACUS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot inspect "${{ inputs.query }}"
