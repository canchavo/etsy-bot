name: Telegram onay kontrolü
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Kaç tur daha dinlesin (her tur ~8 dk)"
        required: false
        default: "0"
concurrency:
  group: poll
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      panel: ${{ steps.poll.outputs.changed }}
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Telegram'ı kontrol et ve onaylananları yayınla
        id: poll
        run: python -m bot poll --loop 480 | tee poll.log && grep -o 'changed=.*' poll.log | tail -1 | sed 's/changed=True/changed=true/;s/changed=False/changed=false/' >> "$GITHUB_OUTPUT"
      - name: Dinlemeye devam et
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
          CHANGED: ${{ steps.poll.outputs.changed }}
        run: |
          next=$(( CHAIN - 1 ))
          # someone is using the bot right now -> keep listening a bit longer
          if [ "$CHANGED" = "true" ] && [ $next -lt 2 ]; then next=2; fi
          # listen continuously (24/7): buttons react within seconds and the listener
          # also starts the daily production at 09:20, so nothing depends on GitHub's cron
          if [ $next -lt 1 ]; then next=1; fi
          if [ $next -ge 0 ]; then gh workflow run poll.yml --repo "$GITHUB_REPOSITORY" -f chain=$next; fi
      - name: Paneli hazırla
        if: steps.poll.outputs.changed == 'true'
        run: python -m bot panel --out _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.poll.outputs.changed == 'true'
        with:
          path: _site
  deploy-panel:
    needs: run
    if: always() && needs.run.outputs.panel == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
